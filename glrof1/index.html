    * {

    .controls {

    .search-input {

      width: 100%;
      max-width: 400px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .filter-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #e2e8f0;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    /* Grid de Produtos */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    /* Card de Produto */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--badge);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      z-index: 10;
    }

    .card-img-container {
      width: 100%;
      height: 200px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-category {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.75rem;
    }

    .card-pricing {
      margin-top: auto;
      margin-bottom: 1rem;
    }

    .price-old {
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: line-through;
    }

    .price-new {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);

    .affiliate-btn {

      font-size: 0.95rem;

    function renderProducts() {
      grid.innerHTML = "";

      const filtered = products.filter(product => {
        const matchesCategory = currentCategory === "all" || product.category === currentCategory;
        const matchesSearch = product.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 2rem 0;">Nenhuma oferta encontrada.</p>`;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          ${p.discountBadge ? `<span class="badge">${p.discountBadge}</span>` : ""}
          <div class="card-img-container">
            <img src="${p.image}" alt="${p.title}" class="card-img" loading="lazy">
          </div>
          <div class="card-body">
            <span class="card-category">${p.categoryName}</span>
            <h3 class="card-title">${p.title}</h3>
            <div class="card-pricing">
              ${p.oldPrice ? `<div class="price-old">${p.oldPrice}</div>` : ""}
              <div class="price-new">${p.newPrice}</div>
            </div>
            <a href="${p.affiliateLink}" target="_blank" rel="nofollow noopener sponsored" class="affiliate-btn">
              Ver Oferta
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 3. Event Listeners para Filtros e Busca
    filterBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        filterBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.category;
        renderProducts();
      });
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderProducts();
    });

    // Render inicial
    renderProducts();
  </script>

  </center>
